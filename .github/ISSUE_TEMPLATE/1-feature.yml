name: Feature
description: 새 기능이나 새 시스템을 만듭니다.
title: "[Feat] "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 개요
      description: 이 기능이 무엇이고, 완성되면 플레이어가 무엇을 할 수 있게 되는지 1~3문장으로 씁니다.
      placeholder: 연습장에서 블록을 조합해 만든 함수를 허수아비에게 시전할 수 있게 한다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 이 기능을 끝내려면 해야 하는 작업을 잘게 나눠 적습니다. 한 항목은 하루 안에 끝낼 수 있는 크기로 나눕니다.
      placeholder: |
        - [ ] 블록 드래그 앤 드롭 UI
        - [ ] 블록 조합을 함수 데이터로 변환
        - [ ] 시전 시 스택 메모리 점유
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 다른 팀원이 직접 확인할 수 있는 모습으로 씁니다. "구현 완료"처럼 쓰지 않습니다.
      placeholder: 연습장 씬에서 불 뿜기 함수를 만들어 허수아비에게 시전하면, 데미지 숫자가 뜨고 메모리 게이지가 줄었다가 돌아온다.
    validations:
      required: true
