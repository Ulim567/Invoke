name: Design
description: 애니메이션, 맵, 그림, 소리 같은 게임 콘텐츠를 만듭니다.
title: "[Design] "
labels: ["design"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      description: 만드는 것의 종류를 고릅니다.
      options:
        - 애니메이션
        - 스프라이트
        - 타일
        - 맵
        - 이펙트
        - UI
        - 사운드
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 내용
      description: 무엇을 만드는지, 게임의 어디에 쓰이는지 씁니다.
      placeholder: C 캐릭터가 사냥터에서 좌우로 걸을 때 재생되는 걷기 애니메이션.
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: 규격
      description: 다시 만들지 않도록 크기와 형식을 정확히 씁니다. 해당하는 줄만 채우고 나머지는 지웁니다.
      value: |
        - 캔버스 크기:
        - PPU:
        - 프레임 수:
        - 재생 속도(FPS):
        - Pivot 위치:
        - 맵 크기(칸 수):
        - (사운드) 길이와 반복 여부:
    validations:
      required: false

  - type: input
    id: deadline
    attributes:
      label: 마감일
      description: 이 날짜까지 필요합니다.
      placeholder: "2026-10-30"
    validations:
      required: true
